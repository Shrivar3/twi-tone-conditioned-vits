project:
  name: twi-full-tone-vits-train
  seed: 42

model_id: FarmerlineML/main_twi_TTS
output_dir: checkpoints/full_vits_tone_train

data:
  train_filelist: data/filelists/full_vits/train.txt
  val_filelist: data/filelists/full_vits/val.txt
  test_filelist: data/filelists/full_vits/test.txt
  audio_root: null
  max_rows: null
  allow_missing_audio: false
  synthetic_audio_seconds: 1.0

audio:
  sampling_rate: 22050
  filter_length: 1024
  hop_length: 256
  win_length: 1024
  n_mel_channels: 80
  mel_fmin: 0.0
  mel_fmax: null

model:
  segment_size: 8192
  inter_channels: 192
  hidden_channels: 192
  filter_channels: 768
  n_heads: 2
  n_layers: 6
  kernel_size: 3
  p_dropout: 0.1
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes:
    - [1, 3, 5]
    - [1, 3, 5]
    - [1, 3, 5]
  upsample_rates: [8, 8, 2, 2]
  upsample_initial_channel: 512
  upsample_kernel_sizes: [16, 16, 4, 4]
  tone_conditioning_mode: concat_projection
  tone_embedding_scale: 1.0
  use_tone_conditioning: true
  discriminator_base_channels: 16
  discriminator_periods: [2, 3, 5, 7, 11]

training:
  batch_size: 16
  num_workers: 4
  max_steps: 200000
  learning_rate: 0.0002
  betas: [0.8, 0.99]
  eps: 0.000000001
  grad_clip: 5.0
  save_every: 5000
  validate_every: 5000
  log_every: 50
  seed: 42
  loss_weights:
    mel: 45.0
    kl: 1.0
    duration: 1.0
    feature_matching: 2.0
    generator_adv: 1.0
