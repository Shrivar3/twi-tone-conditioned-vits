project:
  name: twi-full-tone-vits-debug
  seed: 42

model_id: FarmerlineML/main_twi_TTS
output_dir: checkpoints/full_vits_tone_debug

data:
  train_filelist: data/filelists/full_vits/train.txt
  val_filelist: data/filelists/full_vits/val.txt
  test_filelist: data/filelists/full_vits/test.txt
  audio_root: null
  max_rows: 8
  allow_missing_audio: false
  synthetic_audio_seconds: 1.0

audio:
  sampling_rate: 22050
  filter_length: 1024
  hop_length: 256
  win_length: 1024
  n_mel_channels: 80
  mel_fmin: 0.0
  mel_fmax: null

model:
  segment_size: 4096
  inter_channels: 64
  hidden_channels: 64
  filter_channels: 128
  n_heads: 2
  n_layers: 2
  kernel_size: 3
  p_dropout: 0.1
  resblock_kernel_sizes: [3, 7]
  resblock_dilation_sizes:
    - [1, 3]
    - [1, 3]
  upsample_rates: [8, 8, 2, 2]
  upsample_initial_channel: 128
  upsample_kernel_sizes: [16, 16, 4, 4]
  tone_conditioning_mode: concat_projection
  tone_embedding_scale: 1.0
  use_tone_conditioning: true
  discriminator_base_channels: 8
  discriminator_periods: [2, 3, 5]

training:
  batch_size: 2
  num_workers: 0
  max_steps: 20
  learning_rate: 0.0002
  betas: [0.8, 0.99]
  eps: 0.000000001
  grad_clip: 5.0
  save_every: 10
  validate_every: 10
  log_every: 1
  seed: 42
  loss_weights:
    mel: 45.0
    kl: 1.0
    duration: 1.0
    feature_matching: 2.0
    generator_adv: 1.0
